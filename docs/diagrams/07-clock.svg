<g stroke="#2348C8" stroke-width="4.1" stroke-linecap="round" opacity="0.55"><line x1="691.2" y1="85.2" x2="706.8" y2="100.8"/><line x1="706.8" y1="85.2" x2="691.2" y2="100.8"/></g>
<text x="780.2" y="99.48" font-size="18" font-weight="700" fill="#6F6A62" text-anchor="end">1:12</text>
<rect x="806" y="70" width="118" height="46" rx="12.9" fill="#FFFFFF" stroke="#B3261E" stroke-width="2.5"/>
<circle cx="829.0" cy="93.0" r="7.8" fill="none" stroke="#CF5206" stroke-width="4.1" opacity="0.55"/>
<text x="910.2" y="99.48" font-size="18" font-weight="700" fill="#B3261E" text-anchor="end">0:00</text>
<line x1="296" y1="93" x2="340" y2="93" stroke="#2B2A27" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="616" y1="93" x2="660" y2="93" stroke="#2B2A27" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="160" y="150" font-size="15" font-weight="400" fill="#6F6A62" text-anchor="middle">Only the player to move</text>
<text x="160" y="172" font-size="15" font-weight="400" fill="#6F6A62" text-anchor="middle">counts down.</text>
<text x="480" y="150" font-size="15" font-weight="400" fill="#6F6A62" text-anchor="middle">X's clock stops and gains the</text>
<text x="480" y="172" font-size="15" font-weight="400" fill="#6F6A62" text-anchor="middle">increment (here 5 seconds).</text>
<text x="480" y="194" font-size="15" font-weight="400" fill="#6F6A62" text-anchor="middle">O's clock starts by itself.</text>
<text x="800" y="150" font-size="15" font-weight="400" fill="#6F6A62" text-anchor="middle">O ran out of time.</text>
<text x="800" y="172" font-size="15" font-weight="400" fill="#6F6A62" text-anchor="middle">X wins the game.</text>
