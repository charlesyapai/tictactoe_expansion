<text x="140.2" y="99.48" font-size="18" font-weight="700" fill="#2B2A27" text-anchor="end">3:41</text>
<rect x="166" y="70" width="118" height="46" rx="12.9" fill="#FFFFFF" stroke="#C9C4B9" stroke-width="1.5"/>
