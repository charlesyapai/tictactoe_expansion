<g stroke="#2348C8" stroke-width="4.1" stroke-linecap="round" opacity="0.55"><line x1="371.2" y1="85.2" x2="386.8" y2="100.8"/><line x1="386.8" y1="85.2" x2="371.2" y2="100.8"/></g>
<text x="460.2" y="99.48" font-size="18" font-weight="700" fill="#6F6A62" text-anchor="end">3:46</text>
<rect x="486" y="70" width="118" height="46" rx="12.9" fill="#FDE5CF" stroke="#CF5206" stroke-width="2.5"/>
