<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" width="960" height="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A27"/></marker></defs>
<rect x="1" y="1" width="958" height="220" rx="14" fill="#FBFAF7" stroke="#E2DED5" stroke-width="2"/>
<text x="160" y="44" font-size="18" font-weight="700" fill="#2B2A27" text-anchor="middle">1. X is thinking</text>
<text x="480" y="44" font-size="18" font-weight="700" fill="#2B2A27" text-anchor="middle">2. X plays</text>
<text x="800" y="44" font-size="18" font-weight="700" fill="#2B2A27" text-anchor="middle">3. A clock reaches zero</text>
